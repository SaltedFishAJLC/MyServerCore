# Passive ability presentation and handler registry.
# Items and equipment sets reference these ids from trigger: PASSIVE entries.
abilities:
  test_vitality:
    handler: stat_bonus
    name: "测试·生命刻印"
    description:
      - "被动提供 {amount} 点力量。"
    allowed_sources: [MAIN_HAND, OFF_HAND, ARMOR, ACCESSORY, TALISMAN, IMPRINT, SET_BONUS]

  test_guard:
    handler: damage_reduction
    name: "测试·守护"
    description:
      - "受到的伤害降低 {amount}。"
    allowed_sources: [ARMOR, ACCESSORY, TALISMAN, IMPRINT, SET_BONUS]

  test_echo_strike:
    handler: on_hit_damage
    name: "测试·回响打击"
    description:
      - "攻击后追加 {amount} 点真实伤害。"
    allowed_sources: [MAIN_HAND, OFF_HAND, ARMOR, ACCESSORY, TALISMAN, IMPRINT, SET_BONUS]

  test_revival:
    handler: revive
    name: "测试·不灭印记"
    description:
      - "受到致死伤害时保留 {health} 点生命。"
    allowed_sources: [ARMOR, ACCESSORY, TALISMAN, IMPRINT, SET_BONUS]
    survival_group: REVIVE
    event_priority: 100

  test_set_fury:
    handler: outgoing_multiplier
    name: "测试·套装怒意"
    description:
      - "造成的伤害提高 {amount}。"
    allowed_sources: [SET_BONUS]

  elder_crown_blood_thirst:
    handler: bleed_lifesteal
    name: "鲜血渴望"
    description:
      - "每秒将你实际造成的流血伤害转化为吸血恢复。"
      - "每秒最多恢复最大生命值的 15%，且不受血魔翻倍。"
    allowed_sources: [ARMOR, IMPRINT]

  crimson_inferno_bloodied_force:
    handler: missing_health_set_stat
    name: "绯红炼狱·浴血"
    description:
      - "每损失 1% 生命，已穿戴的绯红炼狱部件所提供的面板攻击力提高 0.3%。"
    allowed_sources: [SET_BONUS]

  crimson_inferno_dominus:
    handler: dominus_sword_aura
    name: "肃杀之气"
    description:
      - "击杀敌对生物获得 Dominus，最高 10 层；停杀 5 秒后每 5 秒失去 1 层。"
      - "近战命中时，每层提供 10% 剑气概率；剑气对前方 8 格目标造成本次伤害的 75%。"
    allowed_sources: [SET_BONUS]

  crimson_conquest_bleed:
    handler: bleed_on_hit
    name: "猩红征伐"
    description:
      - "近战命中有 30% 概率使目标流血，在 10 秒内均匀失去 400 点生命。"
    allowed_sources: [MAIN_HAND]
