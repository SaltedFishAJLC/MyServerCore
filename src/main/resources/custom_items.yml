# YAML-driven custom equipment templates.
# This file is copied to plugins/ServerCore/custom_items.yml on first start.
#
# Example:

# items:
#   foundry_flame_sword:
#     material: NETHERITE_SWORD
#     name: "铸炉熔火长剑"
#     rarity: LEGENDARY
#     weapon_template: ONE_HANDED_SWORD
#     hand_rule: BOTH_HANDS
#     custom_model_data: 10001
#     unbreakable: false
#     stats:
#       damage: 120
#       crit_chance: 0.15
#       crit_damage: 0.50
#       brutality: 8
#     sockets:
#       - WEAPON
#       - UNIVERSAL
#     enchants:
#       critical: 2
#     abilities:
#       molten_slash:
#         trigger: RIGHT_CLICK
#         cooldown: 8
#         lore:
#           - "右键释放一道熔火斩击。"
#     story_lore:
#       - "由铸炉深处的余烬锻成。"

#   painted_guard:
#     material: SHIELD
#     name: "绘纹守盾"
#     rarity: RARE
#     weapon_template: SHIELD
#     hand_rule: OFF_HAND_ONLY
#     shield:
#       color: BLUE
#       patterns:
#         - WHITE:STRIPE_CENTER
#         - CYAN:CROSS
#     stats:
#       shield_block_threshold: 14
#       shield_effective_block: 0.7
#       shield_cooldown_seconds: 2.5

#   trimmed_coat:
#     material: LEATHER_CHESTPLATE
#     name: "镶纹皮甲"
#     rarity: EPIC
#     appearance:
#       leather_color: "#7A2F20"
#       trim:
#         material: minecraft:gold
#         pattern: minecraft:spire
#     stats:
#       base_armor: 80

# Notes:
# - Percentage stats use decimals: 0.15 = +15.0%.
# - abilities are parsed and written to item lore, but no trigger logic is registered by default.
# - Use /sc admin items id <id> to stamp the held item with a custom internal id.
# - Use /sc admin items save [id] to export the held item into plugins/ServerCore/custom_items.yml.
# - Use /sc admin items reload after editing.

items:
