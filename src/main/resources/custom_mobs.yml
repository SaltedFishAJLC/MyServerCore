# Rules are evaluated from top to bottom. A rule matches only when every
# configured matcher passes.
#
# Supported matchers:
#   match_type: ZOMBIE
#   match_name: "Dungeon Guard"        # case-insensitive contains match
#   match_name_regex: "^Elite .+$"
#   match_mythic_id: "FlameDemon"
#   match_pdc_id: "WDA_Dungeon_Guard"
#   match_scoreboard_tag: "servercore_elite"
#   match_scoreboard_tags:
#     - "servercore_elite"
#   match_equipment:
#     helmet: IRON_HELMET
#     chestplate: IRON_CHESTPLATE
#     leggings: IRON_LEGGINGS
#     boots: IRON_BOOTS
#     main_hand: IRON_SWORD
#
# Overrides:
#   display_name: "Abandoned Temple Guard"
#   level_mode: FIXED       # NATURAL_ADAPTIVE, FIXED, WORLD_CAP, AREA, ADAPTIVE_CLAMPED
#   override_power_level: 25 # legacy alias for a fixed content level
#   level: 25               # also accepted for FIXED
#   base_level: 50          # used by AREA / ADAPTIVE_CLAMPED
#   player_scale: 0.25      # used by ADAPTIVE_CLAMPED
#   min_level: 45
#   max_level: 70
#   bypass_world_level_cap: true   # optional; dynamic level ignores Overworld/Nether/End caps
#   mod: 1.8
#   override_base_hp: 40
#   fixed_max_health: 500   # optional; final max health, bypasses combat-level health scaling
#   override_base_atk: 8
#   spawner_limit_enabled: true
#   spawner_limit: 6        # optional; max nearby spawner mobs for this rule, 0 blocks spawner spawns
#   spawner_check_radius: 24
#   spawner_vertical_radius: 12
#   spawner_limit_mode: rule # rule = same custom mob rule, type = same vanilla entity type
#   always_hostile: false   # optional; repeatedly targets nearby players
#   clear_vanilla_drops: false   # optional; true means replace existing drops instead of appending
#   drops:
#     - item_id: foundry_flame_sword
#       chance: 0.02
#       amount: 1
#     - material: GOLD_NUGGET
#       chance: 45%
#       amount: 2-5

WDA_Dungeon_Guard:
  match_type: ZOMBIE
  match_name: "Dungeon Guard"
  display_name: "Abandoned Temple Guard"
  level_mode: FIXED
  override_power_level: 25
  bypass_world_level_cap: true
  mod: 1.8
  override_base_hp: 40
  # fixed_max_health: 500
  spawner_limit: 6
  spawner_check_radius: 24
  spawner_vertical_radius: 12
  spawner_limit_mode: rule
  drops:
    - material: GOLD_NUGGET
      chance: 45%
      amount: 2-5

Mythic_Flame_Boss:
  match_mythic_id: "FlameDemon"
  display_name: "Flame Demon"
  level_mode: FIXED
  level: 150
  bypass_world_level_cap: true
  mod: 6.4
  drops:
    - item_id: foundry_flame_sword
      chance: 0.02
      amount: 1

