# Editable rare gathering loot tables.
# This file is copied to plugins/ServerCore/gathering_loot.yml on first start.
#
# Bounty:
# - Triggered only by foraging breaks, including sweep breaks.
# - Chance comes from the held tool stat: bounty 5 = 5%.
#
# Overbloom / 溢绽:
# - Triggered only when a player harvests a mature farming crop.
# - Chance comes from the held tool stat: overbloom 5 = 5%.
# - custom_item is resolved from custom_items.yml first.
# - fallback_material is used when the custom item id is not loaded.
# - Use /sc admin gatheringloot reload after editing.

