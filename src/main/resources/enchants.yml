version: 1

settings:
  disabled_lore_mode: SHOW_GRAY
  unknown_enchant_lore_mode: SHOW_RAW
  ultimate_limit_per_item: 1
  rare_effects_require_enabled: true
  numeric_bonus_require_enabled: true
  count_disabled_ultimate_in_limit: false

enchants:
  # 新增附魔时必须补充“效果”注释，便于配置审查和掉落/商店投放时快速判断定位。
  # 效果：近战武器基础伤害加成，属于通用伤害组。
  keen:
    enabled: true
    display: "锋芒"
    rarity: COMMON
    max_level: 7
    soft_max_level: 4
    slots: [MELEE_WEAPON]
    conflict_group: damage_generic
    description:
      - "增加基础伤害。"
      - "当前总计 +{base_damage} 基础伤害。"
    numeric:
      base_damage:
        type: LINEAR
        per_level: 4.0

  # 效果：武器通用增伤乘区加成，属于通用伤害组。
  might:
    enabled: true
    display: "强攻"
    rarity: COMMON
    max_level: 7
    soft_max_level: 4
    slots: [WEAPON]
    conflict_group: damage_generic
    description:
      - "提高综合增伤乘区。"
      - "当前总计 +{base_multiplier_percent}% 增伤。"
    numeric:
      base_multiplier:
        type: LINEAR
        per_level: 0.03

  # 效果：武器与远程武器暴击率加成。
  critical:
    enabled: true
    display: "精准"
    rarity: COMMON
    max_level: 7
    soft_max_level: 4
    slots: [WEAPON, RANGED_WEAPON]
    description:
      - "提高暴击几率。"
      - "当前总计 +{crit_chance_percent}% 暴击率。"
    numeric:
      crit_chance:
        type: LINEAR
        per_level: 0.012

  # 效果：武器与远程武器暴击伤害加成。
  crit_damage:
    enabled: true
    display: "毁伤"
    rarity: COMMON
    max_level: 7
    soft_max_level: 4
    slots: [WEAPON, RANGED_WEAPON]
    description:
      - "提高暴击伤害。"
      - "当前总计 +{crit_damage_percent}% 暴击伤害。"
    numeric:
      crit_damage:
        type: LINEAR
        per_level: 0.04

  # 效果：防具和盾牌基础护甲加成。
  fortify:
    enabled: true
    display: "保护"
    rarity: COMMON
    max_level: 7
    soft_max_level: 4
    slots: [ARMOR, SHIELD]
    conflicts: [projectile_protection]
    description:
      - "提高基础护甲。"
      - "当前总计 +{base_armor} 护甲。"
    numeric:
      base_armor:
        type: LINEAR
        per_level: 10.0

  # 效果：工具挖掘速度加成。
  efficiency_core:
    enabled: true
    display: "效率"
    rarity: COMMON
    max_level: 10
    soft_max_level: 5
    slots: [TOOL]
    description:
      - "提高挖掘速度。"
      - "当前总计 +{tool_mining_speed} 挖掘速度。"
    numeric:
      tool_mining_speed:
        type: LINEAR
        per_level: 40.0

  # 效果：工具通用采集时运加成。
  fortune_core:
    enabled: true
    display: "时运核心"
    rarity: COMMON
    max_level: 10
    soft_max_level: 5
    slots: [TOOL]
    description:
      - "提高通用工具时运。"
      - "当前总计 +{tool_fortune} 工具时运。"
    numeric:
      tool_fortune:
        type: LINEAR
        per_level: 8.0

  # 效果：对 UNDEAD 主标签目标造成额外伤害。
  undead_slayer:
    enabled: true
    display: "亡灵克星"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [WEAPON]
    target:
      main_tags: [UNDEAD]
    description:
      - "对亡灵目标造成更高伤害。"
      - "当前总计 +{damage_to_target_percent}% 伤害。"
    numeric:
      damage_to_target:
        type: LINEAR
        per_level: 0.07

  # 效果：对 SKELETON 主标签目标造成额外伤害。
  skeleton_slayer:
    enabled: true
    display: "碎骨"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [WEAPON]
    target:
      main_tags: [SKELETON]
    description:
      - "对骷髅目标造成更高伤害。"
      - "当前总计 +{damage_to_target_percent}% 伤害。"
    numeric:
      damage_to_target:
        type: LINEAR
        per_level: 0.07

  # 效果：对 HUMANOID 主标签目标造成额外伤害。
  humanoid_slayer:
    enabled: true
    display: "行刑者"
    rarity: UNCOMMON
    max_level: 10
    soft_max_level: 3
    slots: [WEAPON]
    target:
      main_tags: [HUMANOID]
    description:
      - "对人形目标造成更高伤害。"
      - "当前总计 +{damage_to_target_percent}% 伤害。"
    numeric:
      damage_to_target:
        type: LINEAR
        per_level: 0.07

  # 效果：对 CONSTRUCT 主标签目标造成额外伤害。
  construct_breaker:
    enabled: true
    display: "构装破坏"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [WEAPON]
    target:
      main_tags: [CONSTRUCT]
    description:
      - "对构装目标造成更高伤害。"
      - "当前总计 +{damage_to_target_percent}% 伤害。"
    numeric:
      damage_to_target:
        type: LINEAR
        per_level: 0.07

  # 效果：对 GIANT 主标签目标造成额外伤害。
  giant_hunter:
    enabled: true
    display: "巨兽猎手"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [WEAPON]
    target:
      main_tags: [GIANT]
    description:
      - "对巨型目标造成更高伤害。"
      - "当前总计 +{damage_to_target_percent}% 伤害。"
    numeric:
      damage_to_target:
        type: LINEAR
        per_level: 0.07

  # 效果：满蓄力远程攻击伤害加成。
  draw_power:
    enabled: true
    display: "蓄势"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [RANGED_WEAPON]
    description:
      - "提高满蓄力远程伤害。"
      - "当前总计 +{full_charge_damage_percent}% 满蓄力伤害。"
    numeric:
      full_charge_damage:
        type: LINEAR
        per_level: 0.03

  # 效果：镐类工具挖矿时运加成。
  mining_focus:
    enabled: true
    display: "采矿专精"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [PICKAXE]
    description:
      - "提高挖矿时运。"
      - "当前总计 +{mining_fortune} 挖矿时运。"
    numeric:
      mining_fortune:
        type: LINEAR
        per_level: 15.0

  # 效果：近战命中时对周围敌人造成溅射伤害。
  cleave:
    enabled: true
    display: "劈砍"
    rarity: RARE
    max_level: 5
    soft_max_level: 3
    slots: [MELEE_WEAPON]
    conflict_group: melee_mechanic
    description:
      - "近战命中时，对周围敌人造成溅射伤害。"
      - "当前溅射 {damage_ratio_percent}% 伤害。"
    effect:
      type: CLEAVE
      trigger: ON_MELEE_HIT
      params:
        radius:
          type: PER_LEVEL
          values: [3.0, 3.5, 4, 4.5, 5]
        max_targets:
          type: PER_LEVEL
          values: [2, 3, 3, 4, 5]
        damage_ratio:
          type: PER_LEVEL
          values: [0.10, 0.15, 0.20, 0.25, 0.30]
        secondary_damage: true

  # 效果：近战吸血率加成，归入 lifesteal 数值统计。
  vampirism:
    enabled: true
    display: "嗜血"
    rarity: RARE
    max_level: 5
    soft_max_level: 2
    slots: [MELEE_WEAPON]
    conflict_group: sustain_conversion
    description:
      - "提高近战吸血率，并入吸血属性。"
      - "当前总计 +{lifesteal_percent}% 吸血。"
    numeric:
      lifesteal:
        type: PER_LEVEL
        values: [0.01, 0.015, 0.02]

  # 效果：盾牌在短窗口内成功格挡时提高格挡阈值，并按等级降低冷却。
  perfect_guard:
    enabled: true
    display: "完美格挡"
    rarity: RARE
    max_level: 3
    soft_max_level: 2
    slots: [SHIELD]
    description:
      - "举盾瞬间受到攻击时，提高格挡阈值。"
      - "当前 +{threshold_bonus} 格挡阈值。"
    effect:
      type: PERFECT_GUARD
      trigger: ON_SHIELD_BLOCK
      params:
        timing_window_seconds:
          type: CONSTANT
          value: 0.35
        threshold_bonus:
          type: PER_LEVEL
          values: [15.0, 25.0, 40.0]
        cooldown_seconds:
          type: PER_LEVEL
          values: [8.0, 6.0, 4.0]

  # 效果：连续攻击同一首领目标时叠加伤害加成。
  ultimate_apex_slayer:
    enabled: false
    display: "猎王"
    rarity: ULTIMATE
    max_level: 1
    soft_max_level: 1
    slots: [WEAPON]
    conflict_group: ultimate
    description:
      - "连续攻击同一个首领目标时逐渐提高伤害。"
      - "每层 +{damage_bonus_per_stack_percent}% 伤害，最多 {max_stacks} 层。"
    effect:
      type: APEX_SLAYER
      trigger: ON_DAMAGE_CALCULATE
      params:
        damage_bonus_per_stack:
          type: CONSTANT
          value: 0.02
        max_stacks:
          type: CONSTANT
          value: 10
        expire_seconds:
          type: CONSTANT
          value: 5.0

  # 效果：不持盾时提高近战伤害，但提高自身承受伤害。
  ultimate_berserker_oath:
    enabled: true
    display: "狂战誓约"
    rarity: ULTIMATE
    max_level: 3
    soft_max_level: 3
    slots: [MELEE_WEAPON]
    conflict_group: ultimate
    description:
      - "空出盾牌时提高近战伤害，但受到更多伤害。"
      - "当前 +{damage_bonus_percent}% 近战伤害，承伤 +{incoming_damage_penalty_percent}%。"
    effect:
      type: BERSERKER_OATH
      trigger: PASSIVE
      params:
        damage_bonus:
          type: CONSTANT
          value: 0.25
        incoming_damage_penalty:
          type: CONSTANT
          value: 0.12
        require_no_shield: true

  # 效果：胸甲受到致死伤害时保留 1 点生命并清除负面效果，随后进入冷却。
  ultimate_phoenix_core:
    enabled: true
    display: "不灭余烬"
    rarity: ULTIMATE
    max_level: 1
    soft_max_level: 1
    slots: [CHESTPLATE]
    conflict_group: ultimate
    description:
      - "受到致死伤害时保留一点生命并进入冷却。"
      - "冷却 {cooldown_seconds} 秒，触发后保留 {remain_health} 生命。"
    effect:
      type: PHOENIX_CORE
      trigger: ON_FATAL_DAMAGE
      params:
        cooldown_seconds:
          type: CONSTANT
          value: 180.0
        remain_health:
          type: CONSTANT
          value: 1.0
        clear_negative_effects: true

  # 效果：原版式近战击退，命中后按等级推开目标。
  knockback:
    enabled: true
    display: "击退"
    rarity: COMMON
    max_level: 2
    soft_max_level: 2
    slots: [MELEE_WEAPON]
    description:
      - "近战命中时击退目标。"
      - "当前等级提供 {knockback_strength} 级击退强度。"
    numeric:
      knockback_strength:
        type: LINEAR
        per_level: 1.0

  # 效果：近战残暴值加成，属于通用伤害组，和锋芒/强攻互斥。
  ruthless:
    enabled: true
    display: "冷酷"
    rarity: COMMON
    max_level: 7
    soft_max_level: 3
    slots: [MELEE_WEAPON]
    conflict_group: damage_generic
    description:
      - "提高近战残暴值。"
      - "当前总计 +{brutality} 残暴。"
    numeric:
      brutality:
        type: LINEAR
        per_level: 5.0

  # 效果：远程武器通用伤害乘区，当前作为远程命中乘区生效。
  power:
    enabled: true
    display: "力量"
    rarity: COMMON
    max_level: 7
    soft_max_level: 4
    slots: [RANGED_WEAPON]
    description:
      - "提高远程攻击造成的伤害。"
      - "当前总计 +{ranged_damage_percent}% 远程伤害。"
    numeric:
      ranged_damage:
        type: LINEAR
        per_level: 0.08

  # 效果：原版式远程冲击，箭矢命中后按等级推开目标。
  punch:
    enabled: true
    display: "冲击"
    rarity: COMMON
    max_level: 2
    soft_max_level: 2
    slots: [RANGED_WEAPON]
    description:
      - "远程命中时击退目标。"
      - "当前等级提供 {punch_strength} 级冲击强度。"
    numeric:
      punch_strength:
        type: LINEAR
        per_level: 1.0

  # 效果：近战或远程命中后点燃目标，并追加基于本次伤害的火焰减益伤害。
  fire_aspect:
    enabled: true
    display: "火舌"
    rarity: UNCOMMON
    max_level: 3
    soft_max_level: 3
    slots: [MELEE_WEAPON, RANGED_WEAPON]
    description:
      - "命中后点燃目标并追加火焰减益伤害。"
      - "当前点燃 {ignite_seconds} 秒，追加 {ignite_damage_percent}% 本次伤害。"
    numeric:
      ignite_seconds:
        type: LINEAR
        per_level: 2.0
      ignite_damage:
        type: LINEAR
        per_level: 0.03

  # 效果：击杀怪物时提高金币赏金系数。
  scavenger:
    enabled: true
    display: "野蛮"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [WEAPON]
    description:
      - "击杀怪物时提高金币赏金。"
      - "当前赏金系数 +{bounty_multiplier}。"
    numeric:
      bounty_multiplier:
        type: LINEAR
        per_level: 0.3

  # 效果：对 FLYING 特质目标造成额外伤害。
  antigravity:
    enabled: true
    display: "反重力"
    rarity: UNCOMMON
    max_level: 7
    soft_max_level: 3
    slots: [RANGED_WEAPON, MAGIC_WEAPON]
    target:
      trait_tags: [FLYING]
    description:
      - "对飞行目标造成更高伤害。"
      - "当前总计 +{damage_to_trait_tag_percent}% 对飞行目标伤害。"
    numeric:
      damage_to_trait_tag:
        type: LINEAR
        per_level: 0.07

  # 效果：远程射击概率不消耗箭矢。
  infinite_quiver:
    enabled: true
    display: "无尽"
    rarity: UNCOMMON
    max_level: 10
    soft_max_level: 5
    slots: [RANGED_WEAPON]
    description:
      - "射箭时有概率不消耗箭矢。"
      - "当前总计 {free_arrow_chance_percent}% 不消耗箭矢。"
    numeric:
      free_arrow_chance:
        type: LINEAR
        per_level: 0.05

  # 效果：弩装填时间缩短；第一版先作为配置和说明入口，装填公式后续接入弩模板。
  spring_mechanism:
    enabled: true
    display: "机簧改造"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [CROSSBOW]
    description:
      - "缩短弩装填时间。"
      - "当前总计减少 {reload_reduction_percent}% 装填时间。"
    numeric:
      reload_reduction:
        type: PER_LEVEL
        values: [0.08, 0.16, 0.24, 0.32, 0.40]

  # 效果：长弓满蓄力命中时提高伤害。
  full_draw:
    enabled: true
    display: "满弦"
    rarity: UNCOMMON
    max_level: 5
    soft_max_level: 3
    slots: [LONGBOW]
    description:
      - "满蓄力射击获得额外伤害。"
      - "当前满蓄力伤害 +{full_draw_damage_percent}%。"
    numeric:
      full_draw_damage:
        type: PER_LEVEL
        values: [0.04, 0.07, 0.10, 0.13, 0.16]

  # 效果：近战或法术命中时按造成伤害恢复魔力，和嗜血/饮血互斥。
  mana_steal:
    enabled: true
    display: "魔力汲取"
    rarity: RARE
    max_level: 5
    soft_max_level: 3
    slots: [MELEE_WEAPON, MAGIC_WEAPON]
    conflict_group: sustain_conversion
    description:
      - "近战或法术命中时恢复魔力。"
      - "当前将 {mana_steal_percent}% 造成伤害转化为魔力，触发冷却 0.75 秒。"
    numeric:
      mana_steal:
        type: LINEAR
        per_level: 0.004

  # 效果：击杀敌对生物后按缺失生命恢复生命，和嗜血/魔力汲取互斥。
  drain:
    enabled: true
    display: "饮血"
    rarity: RARE
    max_level: 5
    soft_max_level: 3
    slots: [MELEE_WEAPON]
    conflict_group: sustain_conversion
    description:
      - "击杀敌对生物后立即恢复生命。"
      - "当前恢复 {drain_missing_health_percent}% 已损失生命，血魔翻倍，触发冷却 0.75 秒。"
    numeric:
      drain_missing_health:
        type: LINEAR
        per_level: 0.025

  # 效果：根据目标当前生命百分比获得额外伤害乘区。
  anatomy:
    enabled: true
    display: "解剖"
    rarity: RARE
    max_level: 5
    soft_max_level: 3
    slots: [MELEE_WEAPON, RANGED_WEAPON]
    description:
      - "目标当前生命越高，命中伤害越高。"
      - "目标每 1% 当前生命提供 {health_percent_damage_percent}% 伤害。"
    numeric:
      health_percent_damage:
        type: PER_LEVEL
        values: [0.001, 0.002, 0.004, 0.005, 0.007]

  # 效果：第一次攻击同一目标时提高伤害，20 秒未命中该目标后刷新。
  first_strike:
    enabled: true
    display: "先发制人"
    rarity: RARE
    max_level: 5
    soft_max_level: 3
    slots: [WEAPON]
    conflict_group: opening_strike
    description:
      - "第一次攻击目标时造成更高伤害。"
      - "当前首次命中 +{first_hit_damage_percent}% 伤害，同目标 20 秒刷新。"
    numeric:
      first_hit_damage:
        type: LINEAR
        per_level: 0.15

  # 效果：近战连续攻击同一目标时，每第三次命中提高伤害。
  triple_strike:
    enabled: true
    display: "三连击"
    rarity: RARE
    max_level: 5
    soft_max_level: 3
    slots: [MELEE_WEAPON]
    conflict_group: opening_strike
    description:
      - "连续攻击同一目标时，每第三次命中造成更高伤害。"
      - "当前第三击 +{third_hit_damage_percent}% 伤害。"
    numeric:
      third_hit_damage:
        type: LINEAR
        per_level: 0.08

  # 效果：近战暴击时对附近敌人释放连锁闪电。
  chain_lightning:
    enabled: true
    display: "连锁闪电"
    rarity: RARE
    max_level: 3
    soft_max_level: 1
    slots: [MELEE_WEAPON]
    conflicts: [cleave, thunderbolt, explosive_bolt]
    description:
      - "近战暴击时造成连锁伤害。"
      - "当前每跳造成 {chain_damage_percent}% 本次伤害，半径 2.5，最多 10 个目标。"
    numeric:
      chain_damage:
        type: PER_LEVEL
        values: [0.04, 0.08, 0.12]

  # 效果：近战暴击时提高本次单体伤害并短暂眩晕目标。
  thunderbolt:
    enabled: true
    display: "雷击"
    rarity: RARE
    max_level: 4
    soft_max_level: 2
    slots: [MELEE_WEAPON]
    conflicts: [chain_lightning]
